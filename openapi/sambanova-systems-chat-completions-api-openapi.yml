          total_tokens: 143
          total_tokens_per_sec: 311.55782443081836
      - choices:
        - delta:
            content: ' Hello'
          index: 0
          finish_reason: null
          logprobs:
            content:
            - token: ' Hello'
              logprob: -0.00012340000000000002
              bytes:
              - 32
              - 72
              - 101
              - 108
              - 108
              - 111
              top_logprobs:
              - token: ' Hello'
                logprob: -0.00012340000000000002
                bytes:
                - 32
                - 72
                - 101
                - 108
                - 108
                - 111
              - token: ' Hi'
                logprob: -8.243
                bytes:
                - 32
                - 72
                - 105
        created: 1737642516.1076705
