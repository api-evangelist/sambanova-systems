          description: type of the tool cal. only `function` is supported.
          enum:
          - function
          const: function
          nullable: true
        index:
          title: index
          description: index of tool call chunk only used when using streaming
          type: integer
          nullable: true
      required:
      - function
    TextContent:
      title: Text Content
      type: object
      additionalProperties: true
      properties:
        type:
          title: Type
          type: string
          description: type of content to send. in this case `text`.
          enum:
          - text
          const: text
        text:
          title: Text
          type: string
          description: string content of the message
      required:
      - type
      - text
    AudioContent:
      title: Audio Content
      type: object
      additionalProperties: true
      properties:
        type:
          title: Type
          type: string
          description: type of content to send. in this case `audio_content`.
          enum:
          - audio_content
          const: audio_content
        audio_content:
          title: Audio Content
          type: object
          properties:
            content:
              title: Content
              type: string
              description: the base64 encoded audio data.
      required:
      - type
      - audio_content
    ToolChoiceObject:
      title: ToolChoiceObject
      type: object
      additionalProperties: true
      properties:
        function:
          title: Function
          type: object
          description: Specifies a tool the model should use. Use it to force the model to call that specific tool.
          additionalProperties: true
          properties:
            name:
              title: Name
              type: string
              description: the name of the tool expected to be used by the model
          required:
          - name
        type:
          type: string
          description: The type of the tool. only `function` is supported.
          enum:
          - function
      required:
      - function
      - type
    ChatCompletionRequest:
      title: Chat Completion Request
      type: object
      description: chat completions request object
      additionalProperties: true
      properties:
        model:
          title: Model
          description: The model ID to use (e.g. gpt-oss-120b).  See available [models](https://docs.sambanova.ai/docs/en/models/sambacloud-models)
          anyOf:
          - type: string
          - enum:
            - Meta-Llama-3.3-70B-Instruct
            - Meta-Llama-3.2-1B-Instruct
            - Meta-Llama-3.2-3B-Instruct
            - Llama-3.2-11B-Vision-Instruct
            - Llama-3.2-90B-Vision-Instruct
            - Meta-Llama-3.1-8B-Instruct
            - Meta-Llama-3.1-70B-Instruct
            - Meta-Llama-3.1-405B-Instruct
            - Qwen2.5-Coder-32B-Instruct
            - Qwen2.5-72B-Instruct
            - QwQ-32B-Preview
            - Meta-Llama-Guard-3-8B
            - DeepSeek-R1
            - DeepSeek-R1-0528
            - DeepSeek-V3-0324
            - DeepSeek-V3.1
            - DeepSeek-V3.1-cb
            - DeepSeek-V3.1-Terminus
            - DeepSeek-V3.2
            - DeepSeek-R1-Distill-Llama-70B
            - Llama-4-Maverick-17B-128E-Instruct
            - Llama-4-Scout-17B-16E-Instruct
            - Qwen3-32B
            - Qwen3-235B
            - Llama-3.3-Swallow-70B-Instruct-v0.4
            - gpt-oss-120b
            - ALLaM-7B-Instruct-preview
            - MiniMax-M2.5
            - MiniMax-M2.7
            - gemma-3-12b-it
        messages:
          title: Messages
          type: array
          description: A list of messages comprising the conversation so far.
          items:
            anyOf:
            - $ref: '#/components/schemas/SystemMessage'
            - $ref: '#/components/schemas/UserMessage'
            - $ref: '#/components/schemas/AssistantMessage'
            - $ref: '#/components/schemas/ToolMessage'
          minItems: 1
          examples:
          - - role: user
              content: create a poem using palindromes
        max_tokens:
          title: Max Tokens
          type: integer
          description: The maximum number of tokens that can be generated in the chat completion.  The total length of input tokens and generated tokens is limited by  the model's context length.
          nullable: true
          example: 2048
        max_completion_tokens:
          title: Max Completion Tokens
          type: integer
          description: The maximum number of tokens that can be generated in the chat completion.  The total length of input tokens and generated tokens is limited by  the model's context length.
          nullable: true
          example: 2048
        temperature:
          title: Temperature
          type: number
          description: What sampling temperature to use, determines the degree of randomness in the response.  between 0 and 2, Higher values like 0.8 will make the output more random,  while lower values like 0.2 will make it more focused and deterministic.  Is recommended altering this, top_p or top_k but not more than one of these.
          minimum: 0
          maximum: 2
          default: 0.7
          nullable: true
          example: 0.7
        top_p:
          title: Top P
          type: number
          description: Cumulative probability for token choices. An alternative to sampling with temperature, called nucleus sampling, where the model considers the results of the tokens with top_p probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered. Is recommended altering this, top_k or temperature but  not more than one of these.
          minimum: 0
          maximum: 1
          nullable: true
          example: 1
        top_k:
          title: Top K
          type: integer
          description: Amount limit of token choices. An alternative to sampling with temperature, the model considers the results of the first K tokens with higher probability.  So 10 means only the first 10 tokens with higher probability are considered. Is recommended altering this, top_p or temperature but not more than one of these.
          minimum: 1
          maximum: 100
          nullable: true
          example: 5
        presence_penalty:
          title: Presence Penalty
          type: number
          description: Number between -2.0 and 2.0. Positive values penalize new tokens based on whether they appear in the text so far, increasing the model's likelihood to talk about new topics. Not currently implemented; accepted for API compatibility
          maximum: 2
          minimum: -2
          default: 0
          nullable: true
        frequency_penalty:
          title: Frequency Penalty
          type: number
          description: Number between -2.0 and 2.0. Positive values penalize new tokens based on their existing frequency in the text so far, decreasing the model's likelihood to repeat the same line verbatim. Not currently implemented; accepted for API compatibility
          maximum: 2
          minimum: -2
          default: 0
        do_sample:
          title: do_sample
          type: boolean
          description: If true, sampling is enabled during output generation. If false, deterministic decoding is used.
          nullable: true
        stop:
          title: Stop
          description: Sequences where the API will stop generating tokens. The returned text will not contain the stop sequence.
          oneOf:
          - type: string
            example: '

              '
            nullable: true
          - type: array
            items:
              type: string
              example: '["\n"]'
          nullable: true
        stream:
          title: Stream
          type: boolean
          description: 'If set, partial message deltas will be sent. Tokens will be sent as data-only  [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format) as they become available, with the stream terminated by a `data: [DONE]` message.'
          default: false
          nullable: true
        stream_options:
          title: StreamOptions
          type: object
          description: Options for streaming response. Only set this when setting stream as true
          additionalProperties: true
          properties:
            include_usage:
              anyOf:
              - type: boolean
              title: Include Usage
              description: Whether to include the usage metrics in a final chunk or not
              nullable: true
          nullable: true
        response_format:
          title: Response Format
          description: 'An object specifying the format that the model must output.   Setting to `{ "type": "json_object"}` enables JSON mode,    which will check the message the model generates is valid JSON.  **Important:** when using JSON mode, you **must** also instruct the model to produce JSON yourself  via a system or user message. Setting to `{ "type": "json_schema", "json_schema": {<your_schema>}"}` enables JSON schema mode,    which will check the message the model generates is valid object of type <your_schema>.  Setting to `{ "type": "text"}` is equivalent to the default plain text generation'
          oneOf:
          - $ref: '#/components/schemas/ResponseFormatJSONSchema'
          - $ref: '#/components/schemas/ResponseFormatJSONObject'
          - $ref: '#/components/schemas/ResponseFormatText'
          discriminator:
            propertyName: type
            mapping:
              json_schema: '#/components/schemas/ResponseFormatJSONSchema'
              json_object: '#/components/schemas/ResponseFormatJSONObject'
              text: '#/components/schemas/ResponseFormatText'
          nullable: true
        reasoning_effort:
          title: Reasoning Effort
          type: string
          description: Value specifying the amount of reasoning the model is allowed to do, increasing it will increase the number of output reasoning tokens generated by the model, but will improve quality of the responses. allowed values are 'low', 'medium', 'high'
          enum:
          - low
          - medium
          - high
          nullable: true
        tool_choice:
          title: Tool Choice
          description: 'Controls which (if any) tool is called by the model.  `none` means the model will not call any tool and instead generates a message.  `auto` means the model can pick between generating a message or calling one or more tools.  `required` means the model must call one or more tools.  Specifying a particular tool via `{"type": "function", "function": {"name": "my_function"}}` forces  the model to call that tool.'
          anyOf:
          - enum:
            - none
            - auto
            - required
            type: string
          - $ref: '#/components/schemas/ToolChoiceObject'
          nullable: true
        parallel_tool_calls:
          title: Parallel Tool Calls
          type: boolean
          description: Whether to enable parallel function calling during tool use, This is not yet supported by our models.
          nullable: true
        tools:
          title: tools
          type: array
          description: A list of tools the model may call.  Use this to provide a list of functions the model may generate JSON inputs for.
          items:
            $ref: '#/components/schemas/Tool'
          maxItems: 128
          nullable: true
        chat_template_kwargs:
          title: Chat Template Kwargs
          type: object
          description: A dictionary of additional keyword arguments to pass into the chat template.  Use this to provide extra context or parameters that the model's chat template  can process. Keys must be strings; values may be any valid JSON type.
          properties:
            enable_thinking:
              $ref: '#/components/schemas/EnableThinking'
          additionalProperties: true
          nullable: true
          example:
            enable_thinking: true
        logprobs:
          title: Logprobs
          type: boolean
          description: Whether to return log probabilities of the output tokens or not. If true, returns the log  probabilities of each output token returned in the `content` of `message`.
          default: false
          nullable: true
        top_logprobs:
          title: Top Logprobs
          type: integer
          description: An integer between 0 and 20 specifying the number of most likely tokens to return at each token  position, each with an associated log probability. `logprobs` must be set to `true` if this parameter is used.
          maximum: 20
          minimum: 0
          nullable: true
        n:
          title: N
          type: integer
          description: 'How many completions to generate for each prompt.

            **Note:** Because this parameter generates many completions, it can quickly consume your token quota. Use carefully and ensure that you have reasonable settings for `max_tokens`.'
          maximum: 8
          minimum: 1
          default: 1
          nullable: true
          example: 1
        logit_bias:
          title: Logit Bias
          type: object
          description: Modify the likelihood of specified tokens appearing in the generation. Accepts a JSON object that maps tokens (specified by their  token ID in the model tokenizer) to an associated bias value from -100 to 100. Mathematically, the bias is added to the logits generated by the model prior to sampling.  Values between -1 and 1 should decrease or increase likelihood of selection; values like -100 or 100 should result in a ban or exclusive selection of the relevant token.
          nullable: true
        seed:
          title: Seed
          description: 'If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same `seed` and parameters should return the same result.

            Determinism is not guaranteed, and you should refer to the `system_fingerprint` response parameter to monitor changes in the backend.'
          nullable: true
          type: integer
      required:
      - model
      - messages
      examples:
      - messages:
        - role: user
          content: create a poem using palindromes
        model: gpt-oss-120b
      - messages:
        - role: system
          content: You are a helpful assistant developed by SambaNova systems
        - role: user
          content: create a poem using palindromes
        max_tokens: 2048
        model: gpt-oss-120b
        stream: false
        temperature: 0.7
        top_p: 1
