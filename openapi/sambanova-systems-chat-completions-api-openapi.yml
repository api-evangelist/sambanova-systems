        model: gpt-oss-120b
        object: chat.completion.chunk
        system_fingerprint: fastcoe
    ResponseFormatJSONObject:
      title: ResponseFormatJSONObject
      type: object
      description: Specifies that the model should produce output as a raw JSON object.
      additionalProperties: true
      properties:
        type:
          const: json_object
          enum:
          - json_object
          title: Type
          type: string
      required:
      - type
      example:
        type: json_object
    FunctionParameters:
      title: Function Parameters
      type: object
      additionalProperties: true
      description: The parameters the functions accepts, described as a JSON Schema object. see the [JSON Schema reference](https://json-schema.org/understanding-json-schema/) for documentation about the format.  Omitting `parameters` defines a function with an empty parameter list.
    ToolMessage:
      title: Tool Message
      type: object
      additionalProperties: true
      properties:
        role:
          title: Role
          type: string
          description: The role of the messages author, in this case `tool`.
          enum:
          - tool
          const: tool
        content:
          title: Content
          description: The contents of the tool message.
          anyOf:
          - type: string
          - title: Text Content Part Array
            type: array
            items:
              $ref: '#/components/schemas/TextContent'
      required:
      - content
      - role
    AssistantMessage:
      title: Assistant Message
      type: object
      additionalProperties: true
      properties:
        role:
          title: Role
          type: string
          description: The role of the messages author, in this case `assistant`.
          enum:
          - assistant
          const: assistant
        content:
          title: Content
          anyOf:
          - type: string
          - title: Text Content Part Array
            type: array
            items:
              $ref: '#/components/schemas/TextContent'
          description: The contents of the assistant message.
          nullable: true
        reasoning:
          title: Reasoning
          type: string
          description: Reasoning (returned by reasoning models like gpt oss)
          nullable: true
        channel:
          title: Channel
          type: string
          description: Channel (returned by reasoning models like gpt oss)
          nullable: true
        tool_calls:
          title: Tool Calls
          type: array
          items:
            $ref: '#/components/schemas/AssistantToolCall'
          description: The tool calls generated by the model.
          nullable: true
      required:
      - role
      - content
    TopLogProbs:
      title: TopLogProbs
      type: object
      additionalProperties: true
      properties:
        bytes:
          title: Bytes
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
        logprob:
          title: Logprob
          type: number
        token:
          title: Token
          type: string
      required:
      - token
      - logprob
      examples:
      - token: ' Hello'
        logprob: -0.00012340000000000002
        bytes:
        - 32
        - 72
        - 101
        - 108
        - 108
        - 111
      - token: ' Hi'
        logprob: -8.243
        bytes:
        - 32
        - 72
        - 105
    EnableThinking:
      title: Enable Thinking
      type: boolean
      description: Enables the model's internal reasoning or "thinking" mode,  if supported by the chat template (deepseek models).
      example: true
    ResponseFormatText:
      title: ResponseFormatText
      type: object
      description: Specifies that the model should produce output as plain text. This value is not supported yet in the chat compeltions api, if this behavior is desired do not set response format.
      additionalProperties: true
      properties:
        type:
          const: text
          enum:
          - text
          title: Type
          type: string
      required:
      - type
    LogProbs:
      title: Completion Log Probs
      type: object
      description: Completion Log Probs object
      additionalProperties: true
      properties:
        content:
          $ref: '#/components/schemas/LogProbsContent'
      required:
      - content
      examples:
      - content:
        - token: ' Hello'
          logprob: -0.00012340000000000002
          bytes:
          - 32
          - 72
          - 101
          - 108
          - 108
          - 111
          top_logprobs:
          - token: ' Hello'
            logprob: -0.00012340000000000002
            bytes:
            - 32
            - 72
            - 101
            - 108
            - 108
            - 111
          - token: ' Hi'
            logprob: -8.243
            bytes:
            - 32
            - 72
            - 105
        - token: '!'
          logprob: -0.0023456
          bytes:
          - 33
          top_logprobs:
          - token: '!'
            logprob: -0.0023456
            bytes:
            - 33
          - token: ','
            logprob: -6.712
            bytes:
            - 44
    GeneralError:
      title: GeneralError
      type: object
      description: other kind of errors
      properties:
        error:
          type: object
          properties:
            code:
              title: code
              type: string
              description: error code
              nullable: true
            message:
              title: message
              type: string
              description: error message
            param:
              title: param
              type: string
              description: error params
              nullable: true
            type:
              title: type
              type: string
              description: error type
            error_model_output:
              title: Error Model Output
              type: string
              description: Raw model output that could not be parsed. Present on `server_error` responses when the model produced output that failed internal parsing (e.g. a malformed tool call JSON).
              nullable: true
        request_id:
          title: request_id
          type: string
          description: unique request identifier for debugging
          nullable: true
      required:
      - error
    ChatCompletionResponse:
      title: Chat Completion Response
      type: object
      description: chat completion response returned by the model
      properties:
        choices:
          title: Choices
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
          minItems: 1
        created:
