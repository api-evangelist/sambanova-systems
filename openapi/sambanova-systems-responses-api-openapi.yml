    ResponseTextContent:
      title: Response Input Text Content
      type: object
      description: A plain text content part for use inside a ResponseMessage.
      properties:
        type:
          title: Type
          type: string
          description: The type of this content part. "input_text" for user, developer, and system roles,  and output_text for assistant messages.
          enum:
          - input_text
          - output_text
        text:
          title: Text
          type: string
          description: The text content of this part.
        annotations:
          title: Annotations
          type: array
          description: Annotations on spans of this text part, such as URL or file citations. Only present on output_text parts returned by the server. Not currently produced by SambaNova — included for OpenAI API compatibility.
          items:
            $ref: '#/components/schemas/ResponseAnnotation'
          nullable: true
        logprobs:
          title: Log Probs
          type: array
          description: Log probability information for the output tokens. Only present on output_text parts when `top_logprobs` is set on the request.
          items:
            $ref: '#/components/schemas/LogProbsContent'
          nullable: true
      required:
      - type
      - text
    ResponseRequest:
      title: Response Request
      type: object
      description: responses request object
      additionalProperties: true
      properties:
        model:
          title: Model
          description: The model ID to use (e.g. gpt-oss-120b).  See available [models](https://docs.sambanova.ai/docs/en/models/sambacloud-models)
          anyOf:
          - type: string
          - enum:
            - gpt-oss-120b
            - MiniMax-M2.5
            - MiniMax-M2.7
        input:
          title: Input
          description: Text input to the model, or a structured list of input items representing the full conversation turn. A plain string is equivalent to a single user message.
          oneOf:
          - type: string
            title: Text input
            description: A plain text input equivalent to a user-role message.
          - type: array
            title: Input item list
            description: An ordered list of input items (messages, tool calls, tool results, etc.).
            items:
              $ref: '#/components/schemas/ResponseInputItem'
            examples:
            - - role: user
                content: What is the weather in San Francisco?
              - role: assistant
                content:
                - type: output_text
                  text: The weather in San Francisco is 65°F and partly cloudy.
              - role: user
                content: What should I wear?
            - - role: user
                content: What is the weather in San Francisco?
              - type: function_call
                id: fc_abc123
                call_id: call_abc123
                name: get_weather
                arguments: '{"location":"San Francisco, CA"}'
                status: completed
              - type: function_call_output
                call_id: call_abc123
                output: '{"temperature":"65°F","condition":"partly cloudy"}'
        instructions:
          title: Instructions
          type: string
          description: Inserts a system (or developer) message as the first item in the model's context. Equivalent to a system-role message prepended to input[].
          nullable: true
        stream:
          title: Stream
          type: boolean
          description: If true, the response is delivered as server-sent events (SSE).
          default: false
          nullable: true
        max_output_tokens:
          title: Max Output Tokens
          type: integer
          description: Upper bound on the number of tokens the model may generate, including visible output tokens and reasoning tokens.
          nullable: true
          example: 1024
        temperature:
          title: Temperature
          type: number
          description: 'Controls randomness in generation. Range: 0–2. It is recommended to alter this, top_p, or top_k but not more than one at a time.'
          minimum: 0
          maximum: 2
          default: 0.7
          nullable: true
          example: 0.7
        top_p:
          title: Top P
          type: number
          description: 'Nucleus sampling cutoff. Range: 0–1. It is recommended to alter this, temperature, or top_k but not more than one at a time.'
          minimum: 0
          maximum: 1
          default: 1
          nullable: true
          example: 1
        top_k:
          title: Top K
          type: integer
          description: Limits sampling to the top K most probable tokens. It is recommended to alter this, top_p, or temperature but not more than one at a time.
          minimum: 1
          maximum: 100
          nullable: true
          example: 5
        top_logprobs:
          title: Top Logprobs
          description: Number of top log-probability entries to return per output token. Null means log probabilities are not returned.
          type: integer
          nullable: true
        frequency_penalty:
          title: Frequency Penalty
          type: number
          description: Number between -2.0 and 2.0. Positive values penalize new tokens based on their existing frequency in the text so far, decreasing the model's likelihood to repeat the same line verbatim. Not currently implemented; accepted for API compatibility and echoed in the response.
          minimum: -2
          maximum: 2
          default: 0
          nullable: true
        presence_penalty:
          title: Presence Penalty
          type: number
          description: Number between -2.0 and 2.0. Positive values penalize new tokens based on whether they appear in the text so far, increasing the model's likelihood to talk about new topics. Not currently implemented; accepted for API compatibility and echoed in the response.
          minimum: -2
          maximum: 2
          default: 0
          nullable: true
        tools:
          title: Tools
          type: array
          description: 'Tools available to the model. Only type: "function" is supported; all other tool types are filtered server-side.'
          items:
            $ref: '#/components/schemas/ResponseTool'
          nullable: true
          maxItems: 128
        parallel_tool_calls:
          title: Parallel Tool Calls
          type: boolean
          description: Whether the model may issue multiple tool calls in parallel within one turn.
          default: true
          nullable: true
        max_tool_calls:
          title: Max Tool Calls
          type: integer
          description: Maximum number of tool calls the model may make in a single response turn. Not currently implemented; accepted for API compatibility.
          nullable: true
        tool_choice:
          $ref: '#/components/schemas/ResponseToolChoiceOption'
        text:
          title: Text
          type: object
          description: Response format configuration. Supports plain text, json_object, and json_schema.
          properties:
            format:
              $ref: '#/components/schemas/ResponseFormatConfiguration'
        reasoning:
          title: Reasoning
          type: object
          description: Reasoning configuration for models that support it. Ignored on non-reasoning models.
          properties:
            effort:
              title: Effort
              type: string
              enum:
              - low
              - medium
              - high
              default: medium
              nullable: true
              description: Reasoning effort level. "low" is faster with less depth; "high" is deeper at higher token cost.
          nullable: true
        user:
          title: User
          type: string
          description: 'Included for API compatibility, but only echoed back in response '
          nullable: true
        metadata:
          title: Metadata
          type: object
          description: Included for API compatibility, but not supported
          nullable: true
          additionalProperties:
            type: string
        store:
          title: Store
          type: boolean
          description: SambaNova is stateless - this field is accepted for API compatibility but has no effect. Always echoed back as false.
          default: false
          nullable: true
        truncation:
          title: Truncation
          type: string
          description: Accepted for API compatibility and echoed in the response. Context truncation behavior is not currently configurable via this field in SambaNova.
          enum:
          - auto
          - disabled
          default: disabled
          nullable: true
        previous_response_id:
          title: Previous Response ID
          type: string
          description: Not supported. SambaNova is stateless and does not maintain server-side conversation state. Accepted for API compatibility but ignored; clients must supply the full conversation history in input[].
          nullable: true
        background:
          title: Background
          type: boolean
          description: Accepted for API compatibility and echoed back in the response. Has no effect on server behavior.
          nullable: true
        service_tier:
          title: Service Tier
          type: string
          description: Accepted for API compatibility and echoed back in the response. Has no effect on server behavior.
          nullable: true
      required:
      - model
      - input
    ResponseVideoContent:
      title: Response Video Content
      type: object
      description: A video content part for use inside a ResponseMessage. Supported in input messages (user role). Provide a URL or base64-encoded video data.
      properties:
        type:
          title: Type
          type: string
          description: The type of this content part. Always "input_video".
          enum:
          - input_video
        video_url:
          title: Video URL
          type: string
          description: A URL of the video or base64-encoded video data in data URL format (e.g. "data:video/mp4;base64,...").
      required:
      - type
      - video_url
    ResponseTextFormatText:
      title: Response Text Format Text
      type: object
      description: Specifies that the model should produce output as plain text. This is the default.
      additionalProperties: false
      properties:
        type:
          title: Type
          type: string
          description: The format type. Always "text".
          enum:
          - text
      required:
      - type
      example:
        type: text
    GeneralError:
      title: GeneralError
      type: object
      description: other kind of errors
      properties:
        error:
          type: object
          properties:
            code:
              title: code
              type: string
              description: error code
              nullable: true
            message:
              title: message
              type: string
              description: error message
            param:
              title: param
              type: string
              description: error params
              nullable: true
            type:
              title: type
              type: string
              description: error type
            error_model_output:
              title: Error Model Output
              type: string
              description: Raw model output that could not be parsed. Present on `server_error` responses when the model produced output that failed internal parsing (e.g. a malformed tool call JSON).
              nullable: true
        request_id:
          title: request_id
          type: string
          description: unique request identifier for debugging
          nullable: true
      required:
      - error
    ResponseResponse:
      title: Response Response
      type: object
      description: A response object returned by POST /responses (non-streaming). Contains the model's output items, echoed input parameters, lifecycle metadata, and token usage.
      properties:
        id:
          title: ID
          type: string
          description: Unique identifier for this response.
        object:
          title: Object
          type: string
          description: The object type. Always "response".
          enum:
          - response
        status:
          title: Status
          type: string
          description: Lifecycle status of the response. "completed" means the model finished successfully. "failed" means an error occurred during generation. "incomplete" means generation was cut short (e.g. max_output_tokens reached).
          enum:
          - completed
          - failed
          - in_progress
          - incomplete
        created_at:
          title: Created At
          type: integer
          description: Unix timestamp (seconds) when the response was created.
        completed_at:
          title: Completed At
          type: integer
          description: Unix timestamp (seconds) when the response finished generating.
          nullable: true
        model:
          title: Model
          type: string
          description: The model ID used to generate this response.
        output:
          title: Output
          type: array
          description: Ordered array of output items generated by the model. Items may be of type "message", "reasoning", or "function_call".
          items:
            $ref: '#/components/schemas/ResponseOutputItem'
        usage:
          $ref: '#/components/schemas/ResponseUsage'
        error:
          title: Error
          type: object
          description: In-band error object present when status is "failed". Null when the response completed successfully.
          properties:
            code:
              title: Code
              type: string
              description: The error code.
            message:
              title: message
              type: string
              description: A human-readable error message.
          nullable: true
          required:
          - code
          - message
        incomplete_details:
          title: Incomplete Details
          type: object
          description: Present when status is "incomplete". Describes why generation stopped before completion (e.g. max_output_tokens reached).
          properties:
            reason:
              type: string
              description: The reason why the response is incomplete.
          nullable: true
        instructions:
          title: Instructions
          type: string
          description: The system instructions echoed from the request, or null if none were provided.
          nullable: true
        temperature:
          title: Temperature
          type: number
          description: The temperature value used for this response.
          nullable: true
        top_p:
          title: Top P
          type: number
          description: The top_p value used for this response.
          nullable: true
        top_k:
          title: Top K
          type: integer
          description: The top_k value used for this response.
          nullable: true
        frequency_penalty:
          title: Frequency Penalty
          type: number
          description: The frequency_penalty value echoed from the request. Not currently implemented; accepted for API compatibility
          nullable: true
        presence_penalty:
          title: Presence Penalty
          type: number
          description: The presence_penalty value echoed from the request. Not currently implemented; accepted for API compatibility
          nullable: true
        tools:
          title: Tools
          type: array
          description: Tool definitions available to the model for this response.
          items:
            $ref: '#/components/schemas/ResponseTool'
