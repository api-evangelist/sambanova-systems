    ResponseInProgressEvent:
      title: Response In Progress Event
      type: object
      description: Emitted when the response transitions to the `in_progress` state, immediately after `response.created`. The embedded response object still has an empty `output` array; model generation has not yet produced any content.
      properties:
        type:
          type: string
          enum:
          - response.in_progress
        sequence_number:
          type: integer
          description: Monotonically increasing counter for ordering events within a streaming response.
        response:
          $ref: '#/components/schemas/ResponseResponse'
      required:
      - type
      - sequence_number
      - response
      example:
        type: response.in_progress
        sequence_number: 1
        response:
          id: resp_18cb0a9a457241f5b0383ebeee31b80d
          object: response
          created_at: 1775853213
          status: in_progress
          model: gpt-oss-120b
          output: []
          usage: null
          error: null
          incomplete_details: null
          instructions: null
          metadata: {}
          parallel_tool_calls: true
          tool_choice: auto
          tools: []
          temperature: 1
          top_p: 1
          frequency_penalty: 0
          presence_penalty: 0
          reasoning:
            effort: medium
            summary: null
          text:
            format:
              type: text
          truncation: disabled
          store: false
          background: false
          service_tier: free
    ResponseContentPartAddedEvent:
      title: Response Content Part Added Event
      type: object
      description: Emitted when a new content part is added to an output item's content array. The part's `text` is empty at this point; subsequent `response.output_text.delta` or `response.reasoning_text.delta` events carry the incremental content.
      properties:
        type:
          type: string
          enum:
          - response.content_part.added
        sequence_number:
          type: integer
          description: Monotonically increasing counter for ordering events within a streaming response.
        item_id:
          type: string
          description: ID of the output item to which this content part belongs.
        output_index:
          type: integer
          description: Index of the parent output item in the response `output` array.
        content_index:
          type: integer
          description: Index of this content part within the output item's `content` array.
        part:
          $ref: '#/components/schemas/ResponseStreamContentPart'
      required:
      - type
      - sequence_number
      - item_id
      - output_index
      - content_index
      - part
      examples:
      - type: response.content_part.added
        sequence_number: 3
        item_id: rs_d608e0328e6340a69919f808ee38df6c
        output_index: 0
        content_index: 0
        part:
          type: reasoning_text
          text: ''
      - type: response.content_part.added
        sequence_number: 9
        item_id: msg_c1eb06dccbc64f469533bb51be664a9e
        output_index: 1
        content_index: 0
        part:
          type: output_text
          text: ''
          annotations: []
          logprobs: []
    ResponseAnnotation:
      title: Response Annotation
      description: An annotation on a span of output text. Currently stubbed for OpenAI API compatibility — SambaNova does not produce annotations.
      oneOf:
      - $ref: '#/components/schemas/ResponseUrlCitation'
      - $ref: '#/components/schemas/ResponseFileCitation'
      discriminator:
        propertyName: type
        mapping:
          url_citation: '#/components/schemas/ResponseUrlCitation'
          file_citation: '#/components/schemas/ResponseFileCitation'
    ResponseStreamContentPart:
      title: Response Stream Content Part
      description: 'A content part within a streaming event. Discriminated by `type`: `output_text` for assistant message content (reuses ResponseTextContent), `reasoning_text` for model reasoning (OSS extension).'
      oneOf:
      - $ref: '#/components/schemas/ResponseTextContent'
      - $ref: '#/components/schemas/ResponseReasoningContent'
      discriminator:
        propertyName: type
        mapping:
          output_text: '#/components/schemas/ResponseTextContent'
          reasoning_text: '#/components/schemas/ResponseReasoningContent'
    ResponseNamedToolChoice:
      title: Response Named Tool Choice
      type: object
      description: Forces the model to call a specific function. Pass this object as tool_choice to guarantee the model will invoke the named function.
      properties:
        type:
          title: Type
          type: string
          description: The type of tool to force. Always "function".
          enum:
          - function
        name:
          title: Name
          type: string
          description: The name of the function to call.
      required:
      - type
      - name
      example:
        type: function
        name: get_weather
    ResponseTool:
      title: Response Tool
      type: object
      description: A tool definition passed to the model via the tools[] array. Only type "function" is supported; other tool types are filtered server-side.
      properties:
        type:
          title: Type
          type: string
          description: The type of tool. Always "function".
          enum:
          - function
        name:
          title: Name
          type: string
          description: The name of the function to be called.
        description:
          title: Description
          type: string
          description: A description of what the function does. Used by the model to decide when and whether to call it.
          nullable: true
        parameters:
          title: Parameters
          type: object
          description: The parameters the function accepts, described as a JSON Schema object. Omit or set to null for functions that take no parameters.
          additionalProperties: true
          nullable: true
        strict:
          title: Strict
          type: boolean
          description: When true, the model is instructed to generate arguments that strictly conform to the provided JSON schema. Not currently enforced by SambaNova accepted for API compatibility and echoed back as null in the response.
          nullable: true
      required:
      - type
      - name
      example:
        type: function
        name: get_weather
        description: Get the current weather for a given location.
        parameters:
          type: object
          properties:
            location:
              type: string
              description: The city and state, e.g. San Francisco, CA
          required:
          - location
          additionalProperties: false
        strict: null
    ResponseFunctionCallOutput:
      title: Response Function Call Output
      type: object
      description: A tool result item used in input[] to return the output of a function call back to the model. Always input-only — the model never outputs function_call_output items. The call_id must match the id of the corresponding ResponseFunctionCall item from the prior model turn.
      properties:
        type:
          title: Type
          type: string
          enum:
          - function_call_output
          description: The type of this item. Always "function_call_output".
        id:
          title: ID
          type: string
          description: Optional identifier for this output item.
          nullable: true
        call_id:
          title: Call ID
          type: string
          description: The call_id of the ResponseFunctionCall item this result corresponds to. Must match exactly.
        output:
          title: Output
          type: string
          description: A JSON string containing the result of the function call. Returned to the model as the tool's response.
        status:
          title: Status
          type: string
          enum:
          - in_progress
          - completed
          - incomplete
          description: Processing state. Optional when constructing input items.
          nullable: true
      required:
      - type
      - call_id
      - output
      example:
        type: function_call_output
        call_id: call_abc123
        output: '{"temperature":"65°F","condition":"partly cloudy"}'
    ResponseFunctionCallArgumentsDoneEvent:
      title: Response Function Call Arguments Done Event
      type: object
      description: Emitted when a function call's arguments have been fully generated. The `arguments` field contains the complete JSON arguments string (equivalent to concatenating all preceding `response.function_call_arguments.delta` values). Structural mirror of `response.function_call_arguments.delta` with `arguments` instead of `delta`.
      properties:
        type:
          type: string
          enum:
          - response.function_call_arguments.done
        sequence_number:
          type: integer
          description: Monotonically increasing counter for ordering events within a streaming response.
        item_id:
          type: string
          description: ID of the function call output item.
        output_index:
          type: integer
          description: Index of the function call output item in the response `output` array.
        arguments:
          type: string
          description: The complete JSON arguments string for the function call.
      required:
      - type
      - sequence_number
      - item_id
      - output_index
      - arguments
      example:
        type: response.function_call_arguments.done
        sequence_number: 10
        item_id: fc_c839dacb61a54c10b6560ad8d161f004
        output_index: 1
        arguments: '{"city":"Bogotá"}'
    ResponseContentPartDoneEvent:
      title: Response Content Part Done Event
      type: object
      description: Emitted when a content part has been fully generated. The `part` field contains the complete content for this part (equivalent to the state after accumulating all preceding delta events). Structural mirror of `response.content_part.added`.
      properties:
        type:
          type: string
          enum:
          - response.content_part.done
        sequence_number:
          type: integer
          description: Monotonically increasing counter for ordering events within a streaming response.
        item_id:
          type: string
          description: ID of the output item this content part belongs to.
        output_index:
          type: integer
          description: Index of the parent output item in the response `output` array.
        content_index:
          type: integer
          description: Index of this content part within the output item's `content` array.
        part:
          $ref: '#/components/schemas/ResponseStreamContentPart'
      required:
      - type
      - sequence_number
      - item_id
      - output_index
      - content_index
      - part
      examples:
      - type: response.content_part.done
        sequence_number: 6
        item_id: rs_d608e0328e6340a69919f808ee38df6c
        output_index: 0
        content_index: 0
        part:
          type: reasoning_text
          text: User wants a three-sentence bedtime story about a unicorn. Provide three sentences, gentle, bedtime. Should be concise.
      - type: response.content_part.done
        sequence_number: 16
        item_id: msg_c1eb06dccbc64f469533bb51be664a9e
        output_index: 1
        content_index: 0
        part:
          type: output_text
          annotations: []
          logprobs: []
          text: Under a moonlit canopy of twinkling stars, a silver-mane unicorn tiptoed into the meadow, leaving a trail of soft, glowing stardust behind each gentle step. She whispered a lullaby to the sleepy flowers, and they swayed in rhythm, their petals folding like tiny blankets around the night. As the world hushed, the unicorn curled around a sleepy child's dream, gifting them a night of sweet, sparkling adventures until sunrise.
    ResponseOutputItemDoneEvent:
      title: Response Output Item Done Event
      type: object
      description: Emitted when an output item has been fully generated and its status transitions to `completed`. The `item` field contains the complete output item including all accumulated content. Structural mirror of `response.output_item.added`.
      properties:
        type:
          type: string
          enum:
          - response.output_item.done
        sequence_number:
          type: integer
          description: Monotonically increasing counter for ordering events within a streaming response.
        output_index:
          type: integer
          description: Index of the output item in the response `output` array.
        item:
          $ref: '#/components/schemas/ResponseOutputItem'
      required:
      - type
      - sequence_number
      - output_index
      - item
      examples:
      - type: response.output_item.done
        sequence_number: 7
        output_index: 0
        item:
          id: rs_d608e0328e6340a69919f808ee38df6c
          type: reasoning
          status: completed
          summary: []
          content:
          - type: reasoning_text
            text: User wants a three-sentence bedtime story about a unicorn. Provide three sentences, gentle, bedtime. Should be concise.
      - type: response.output_item.done
        sequence_number: 17
        output_index: 1
        item:
          id: msg_c1eb06dccbc64f469533bb51be664a9e
          type: message
          role: assistant
          status: completed
          content:
          - type: output_text
            annotations: []
            logprobs: []
            text: Under a moonlit canopy of twinkling stars, a silver-mane unicorn tiptoed into the meadow, leaving a trail of soft, glowing stardust behind each gentle step. She whispered a lullaby to the sleepy flowers, and they swayed in rhythm, their petals folding like tiny blankets around the night. As the world hushed, the unicorn curled around a sleepy child's dream, gifting them a night of sweet, sparkling adventures until sunrise.
      - type: response.output_item.done
        sequence_number: 11
        output_index: 1
        item:
          id: fc_c839dacb61a54c10b6560ad8d161f004
          type: function_call
          call_id: call_e52f086a16c94fa796
          name: get_weather
          arguments: '{"city":"Bogotá"}'
          status: completed
    ResponseFileCitation:
      title: Response File Citation
      type: object
      description: A file citation annotation on an output text span. Not currently implemented by SambaNova — included for OpenAI API compatibility.
      properties:
        type:
          title: Type
          type: string
          description: The annotation type. Always "file_citation".
          enum:
          - file_citation
        file_id:
          title: File ID
          type: string
          description: The ID of the cited file.
        start_index:
          title: Start Index
          type: integer
          description: Character offset in the output text where the citation starts.
        end_index:
          title: End Index
          type: integer
          description: Character offset in the output text where the citation ends.
      required:
      - type
      - file_id
      - start_index
      - end_index
    ResponseOutputTextDoneEvent:
      title: Response Output Text Done Event
      type: object
      description: Emitted when an output text content part has been fully generated. The `text` field contains the complete accumulated output text (equivalent to concatenating all preceding `response.output_text.delta` values). Structural mirror of `response.output_text.delta` with `text` instead of `delta`.
      properties:
        type:
          type: string
          enum:
          - response.output_text.done
        sequence_number:
          type: integer
          description: Monotonically increasing counter for ordering events within a streaming response.
        item_id:
          type: string
          description: ID of the message output item this content belongs to.
        output_index:
          type: integer
          description: Index of the message output item in the response `output` array.
        content_index:
          type: integer
          description: Index of the content part within the output item's `content` array.
        text:
          type: string
          description: The full accumulated output text for this content part.
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/ResponseAnnotation'
          description: All annotations attached to this text part.
        logprobs:
          type: array
          items:
            $ref: '#/components/schemas/LogProbsContent'
          description: Log probability information for all tokens, if requested.
      required:
      - type
      - sequence_number
      - item_id
      - output_index
      - content_index
      - text
      - annotations
      - logprobs
      example:
        type: response.output_text.done
        sequence_number: 15
        item_id: msg_c1eb06dccbc64f469533bb51be664a9e
        output_index: 1
        content_index: 0
        annotations: []
        logprobs: []
        text: Under a moonlit canopy of twinkling stars, a silver-mane unicorn tiptoed into the meadow, leaving a trail of soft, glowing stardust behind each gentle step. She whispered a lullaby to the sleepy flowers, and they swayed in rhythm, their petals folding like tiny blankets around the night. As the world hushed, the unicorn curled around a sleepy child's dream, gifting them a night of sweet, sparkling adventures until sunrise.
    ResponseTextFormatJSONObject:
      title: Response Text Format JSON Object
      type: object
      description: Specifies that the model should produce output as a raw JSON object. The model is not constrained to any specific schema.
      additionalProperties: false
      properties:
        type:
          title: Type
          type: string
          description: The format type. Always "json_object".
          enum:
          - json_object
      required:
      - type
      example:
        type: json_object
    LogProbsContent:
      title: Log Probs Content
      additionalProperties: true
      properties:
        bytes:
          title: Bytes
          anyOf:
          - items:
              type: integer
            type: array
          nullable: true
        logprob:
          title: Logprob
          type: number
        token:
          title: Token
          type: string
        top_logprobs:
          $ref: '#/components/schemas/TopLogProbs'
      required:
      - token
      - logprob
      - top_logprobs
      examples:
      - token: ' Hello'
        logprob: -0.00012340000000000002
        bytes:
        - 32
        - 72
        - 101
        - 108
        - 108
        - 111
        top_logprobs:
        - token: ' Hello'
          logprob: -0.00012340000000000002
          bytes:
          - 32
          - 72
          - 101
          - 108
          - 108
          - 111
        - token: ' Hi'
          logprob: -8.243
          bytes:
          - 32
          - 72
          - 105
    ResponseContent:
      title: Response Content
      description: A typed content part used in both input and output message content arrays. Discriminated by the "type" field.
      oneOf:
      - $ref: '#/components/schemas/ResponseTextContent'
      - $ref: '#/components/schemas/ResponseImageContent'
      - $ref: '#/components/schemas/ResponseAudioContent'
      - $ref: '#/components/schemas/ResponseVideoContent'
      discriminator:
        propertyName: type
        mapping:
          input_text: '#/components/schemas/ResponseTextContent'
          output_text: '#/components/schemas/ResponseTextContent'
          input_image: '#/components/schemas/ResponseImageContent'
          input_audio: '#/components/schemas/ResponseAudioContent'
          input_video: '#/components/schemas/ResponseVideoContent'
  securitySchemes:
    api_key:
      type: http
      description: SambaNova API Key
      scheme: bearer
      bearerFormat: apiKey
externalDocs:
  description: Find out more in the official SambaNova docs
  url: https://docs.sambanova.ai/cloud/api-reference/overview
