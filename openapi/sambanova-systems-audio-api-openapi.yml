        logprob:
          title: Logprob
          type: number
        token:
          title: Token
          type: string
        top_logprobs:
          $ref: '#/components/schemas/TopLogProbs'
      required:
      - token
      - logprob
      - top_logprobs
      examples:
      - token: ' Hello'
        logprob: -0.00012340000000000002
        bytes:
        - 32
        - 72
        - 101
        - 108
        - 108
        - 111
        top_logprobs:
        - token: ' Hello'
          logprob: -0.00012340000000000002
          bytes:
          - 32
          - 72
          - 101
          - 108
          - 108
          - 111
        - token: ' Hi'
          logprob: -8.243
          bytes:
          - 32
          - 72
          - 105
    TranscriptionTranslationRequestProperties:
      title: Transcription Translation Request Properties
      type: object
      additionalProperties: true
      properties:
        model:
          title: Model
          description: The model ID to use See available [models](https://docs.sambanova.ai/docs/en/models/sambacloud-models)
          anyOf:
          - type: string
          - enum:
            - Whisper-Large-v3
        file:
          title: file
          description: 'The audio file object to transcribe or translate, in one of these formats: FLAC, MP3, MP4, MPEG, MPGA, M4A, Ogg, WAV, or WebM format.  File size limit is 25MB.'
