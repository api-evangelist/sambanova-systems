aid: sambanova-systems
name: SambaNova Systems
description: >-
  SambaNova Systems is an AI infrastructure company that builds custom Reconfigurable Dataflow Unit
  (RDU) chips and the SambaCloud, SambaStack, and SambaRack platforms for fast, energy-efficient AI
  inference. Its developer-facing product, SambaNova Cloud, exposes an OpenAI- and Anthropic-compatible
  inference API (chat completions, completions, the Responses API, the Messages API, embeddings, and
  audio transcription/translation) serving open models such as Meta Llama, DeepSeek, MiniMax, gpt-oss,
  Gemma, and Mistral. A companion Agents Service provides coordinated coding, data-science, deep-research,
  and financial-analysis agents. Official Python and TypeScript SDKs, tiered rate limits, prompt caching,
  and dozens of framework integrations round out the platform.
